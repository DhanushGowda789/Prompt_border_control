<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sovereign Shield — Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f6f1;--s1:#ffffff;--s2:#f0f2eb;--border:#dfe3d8;
  --text:#172019;--muted:#788278;
  --green:#1e9e68;--red:#d9485f;--yellow:#bd8b00;--purple:#546653;--blue:#278b8f;--orange:#e47734;
  --mono:'DM Mono','SFMono-Regular',Consolas,monospace;
  --display:'Space Grotesk','Segoe UI',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--display);font-size:12px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Header */
header{background:var(--s1);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.logo{display:flex;align-items:center;gap:12px}
.logo span{font-size:26px;filter:saturate(.8)}
.logo h1{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-.03em}
.logo p{font-size:10px;color:var(--muted);margin-top:2px}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;background:var(--s2);border:1px solid var(--border);font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);transition:background .3s}
.dot.on{background:var(--green);animation:glow 2s ease infinite}
@keyframes glow{0%,100%{box-shadow:0 0 4px var(--green)}50%{box-shadow:0 0 12px var(--green)}}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px 28px 0;flex-shrink:0}
.stat{background:var(--s1);padding:17px 20px;text-align:left;border:1px solid var(--border);border-radius:14px;box-shadow:0 5px 16px rgba(33,49,38,.04)}
.stat:last-child{border-right:none}
.stat .n{font-size:28px;font-weight:700;line-height:1;letter-spacing:-.04em}
.stat .l{font-size:9px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}

/* Body */
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;padding:20px 28px 28px;min-height:0}

/* Feed */
.feed,.detail{background:var(--s1);border:1px solid var(--border);border-radius:14px;box-shadow:0 5px 16px rgba(33,49,38,.04);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.phead{padding:16px 18px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border);background:var(--s1);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.phead button{background:none;border:1px solid var(--border);color:var(--muted);padding:2px 9px;border-radius:4px;cursor:pointer;font-size:9px;font-family:var(--mono);transition:color .15s}
.phead button:hover{color:var(--text)}
#feed{flex:1;overflow-y:auto;min-height:0}
.ev{padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;animation:si .2s ease}
@keyframes si{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.ev:hover{background:var(--s1)}
.ev.int{border-left:3px solid var(--red)}
.ev.pas{border-left:3px solid var(--green)}
.ev.sel{background:var(--s2)}
.r1{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.bdg{font-size:9px;padding:2px 7px;border-radius:3px;font-weight:700}
.bdg.i{background:rgba(255,68,102,.15);color:var(--red);border:1px solid rgba(255,68,102,.3)}
.bdg.p{background:rgba(0,204,102,.1);color:var(--green);border:1px solid rgba(0,204,102,.2)}
.route{font-size:10px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts{font-size:9px;color:var(--muted)}
.preview{font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.tags{display:flex;gap:3px;flex-wrap:wrap}
.tag{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--s2);border:1px solid var(--border)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:8px;color:var(--muted)}
.empty .big{font-size:36px}

/* Test panel */
.testpanel{border-top:1px solid var(--border);padding:18px;flex-shrink:0;background:var(--s2)}
.presets{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.pb{padding:3px 9px;border-radius:4px;border:1px solid var(--border);background:var(--s2);color:var(--text);font-size:10px;cursor:pointer;font-family:var(--mono);transition:border-color .15s}
.pb:hover{border-color:var(--purple);color:var(--purple)}
.trow{display:flex;gap:8px}
#ti{flex:1;background:var(--s1);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:var(--display);font-size:11px;outline:none;transition:border-color .15s}
#ti:focus{border-color:var(--purple)}
.go{padding:8px 14px;background:var(--text);border:none;border-radius:8px;color:#fff;font-family:var(--display);font-size:11px;cursor:pointer;transition:opacity .15s}
.go:hover{opacity:.85}
#rb{margin-top:8px;padding:9px 11px;border-radius:5px;border:1px solid var(--border);background:var(--s2);font-size:11px;line-height:1.6;display:none}
#rb.show{display:block}

/* Detail */
#det{flex:1;overflow-y:auto;padding:14px;min-height:0}
.dph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:6px;color:var(--muted);font-size:11px}
.dsec{margin-bottom:14px}
.dl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.dv{font-size:11px;color:var(--text);background:var(--s2);padding:8px 10px;border-radius:5px;border:1px solid var(--border);line-height:1.6;word-break:break-word}
.tri{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:5px;background:var(--s2);border:1px solid var(--border);margin-bottom:5px}
.trico{font-size:15px;flex-shrink:0}
.trin{font-size:11px;font-weight:600}
.trim{font-size:9px;color:var(--muted);margin-top:2px}
.trisc{font-size:18px;font-weight:700}
.sbar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:5px}
.sfill{height:100%;border-radius:2px;transition:width .4s}

@media (max-width: 850px){
  body{overflow:auto;height:auto;min-height:100vh}
  .stats{grid-template-columns:repeat(2,1fr);padding:16px}
  main{grid-template-columns:1fr;padding:16px;min-height:900px}
  .detail{min-height:360px}
}

/* Scrollbar */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<header>
  <div class="logo">
    <span>🛡️</span>
    <div>
      <h1>Sovereign Shield</h1>
      <p>Real-time AI query interception monitor</p>
    </div>
  </div>
  <div class="pill">
    <div class="dot" id="dot"></div>
    <span id="status">Connecting...</span>
  </div>
</header>

<div class="stats">
  <div class="stat"><div class="n" id="si" style="color:var(--red)">0</div><div class="l">Intercepted</div></div>
  <div class="stat"><div class="n" id="sp" style="color:var(--green)">0</div><div class="l">Passed</div></div>
  <div class="stat"><div class="n" id="sr" style="color:var(--yellow)">—</div><div class="l">Intercept rate</div></div>
  <div class="stat"><div class="n" id="sm" style="color:var(--purple);font-size:13px;margin-top:8px">—</div><div class="l">Local model</div></div>
</div>

<main>
  <div class="feed">
    <div class="phead">
      <span>Live event feed</span>
      <button id="clear-feed">Clear</button>
    </div>
    <div id="feed">
      <div class="empty" id="empty">
        <div class="big">🔍</div>
        <div>Waiting for AI queries…</div>
        <div style="font-size:10px">Use the test panel below or make a real API call</div>
      </div>
    </div>
    <div class="testpanel">
      <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Test classifier</div>
      <div class="presets">
        <button class="pb" data-preset="safe">✅ Safe</button>
        <button class="pb" data-preset="pii">🪪 PII</button>
        <button class="pb" data-preset="health">🏥 Health</button>
        <button class="pb" data-preset="gov">🏛️ Gov</button>
        <button class="pb" data-preset="fin">💰 Financial</button>
      </div>
      <div class="trow">
        <input id="ti" placeholder="Type a prompt to test…" />
        <button class="go" id="classify">Classify →</button>
      </div>
      <div id="rb"></div>
    </div>
  </div>

  <div class="detail">
    <div class="phead"><span>Event detail</span></div>
    <div id="det">
      <div class="dph">
        <span style="font-size:28px">👆</span>
        <span>Click an event to inspect</span>
      </div>
    </div>
  </div>
</main>

<script src="dashboard.js"></script>
</body>
</html>
